<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">API Gateway WebSocket architecture diagram</title>
  <desc id="desc">Clients connect to an API Gateway WebSocket API that routes to Lambda functions on connect, default, heartbeat, message, and disconnect, with state persisted in DynamoDB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1100" height="600" fill="#f8fafc"/>

  <!-- Clients -->
  <g transform="translate(70,220)" fill="#1f2937">
    <circle cx="30" cy="25" r="25" fill="#e5e7eb"/>
    <path d="M30 60c-22 0-40 10-40 22v12h80v-12c0-12-18-22-40-22z" fill="#e5e7eb"/>
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#111827">Clients</text>
  </g>

  <!-- API Gateway -->
  <g transform="translate(220,150)">
    <rect width="140" height="240" rx="12" fill="#8b5cf6"/>
    <rect x="18" y="20" width="20" height="200" fill="#f5f3ff"/>
    <rect x="102" y="20" width="20" height="200" fill="#f5f3ff"/>
    <rect x="53" y="70" width="34" height="50" rx="4" fill="#f5f3ff"/>
    <rect x="53" y="140" width="34" height="50" rx="4" fill="#f5f3ff"/>
    <text x="70" y="230" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#f8fafc">API Gateway</text>
    <text x="70" y="250" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#f8fafc">WebSocket API</text>
  </g>

  <!-- Lambda stack -->
  <g id="lambda-stack" transform="translate(500,70)">
    <g>
      <rect width="120" height="80" rx="10" fill="#f59e0b"/>
      <text x="60" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
    <g transform="translate(0,90)">
      <rect width="120" height="80" rx="10" fill="#f59e0b"/>
      <text x="60" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
    <g transform="translate(0,180)">
      <rect width="120" height="80" rx="10" fill="#f59e0b"/>
      <text x="60" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
    <g transform="translate(0,270)">
      <rect width="120" height="80" rx="10" fill="#f59e0b"/>
      <text x="60" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
    <g transform="translate(0,360)">
      <rect width="120" height="80" rx="10" fill="#f59e0b"/>
      <text x="60" y="50" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
  </g>

  <!-- DynamoDB -->
  <g transform="translate(830,230)">
    <rect width="140" height="140" rx="16" fill="#a855f7"/>
    <path d="M40 50h60v60H40z" fill="none" stroke="#f3e8ff" stroke-width="6" />
    <path d="M55 65c12 6 28 6 40 0m-40 20c12 6 28 6 40 0m-40 20c12 6 28 6 40 0" stroke="#f3e8ff" stroke-width="6" fill="none"/>
    <text x="70" y="130" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#f8fafc">DynamoDB</text>
  </g>

  <!-- Connectors -->
  <g stroke="#333" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="280" x2="220" y2="280"/>
    <line x1="360" y1="190" x2="500" y2="100"/><!-- $connect -->
    <line x1="360" y1="230" x2="500" y2="190"/><!-- $default -->
    <line x1="360" y1="270" x2="500" y2="280"/><!-- heartbeat -->
    <line x1="360" y1="310" x2="500" y2="370"/><!-- message -->
    <line x1="360" y1="350" x2="500" y2="460"/><!-- $disconnect -->
    <line x1="620" y1="120" x2="830" y2="260"/>
    <line x1="620" y1="290" x2="830" y2="300"/>
    <line x1="620" y1="470" x2="830" y2="350"/>
  </g>

  <!-- Route labels -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#111827">
    <text x="400" y="115">$connect route</text>
    <text x="400" y="205">$default route</text>
    <text x="400" y="255">heartbeat route</text>
    <text x="400" y="335">message route</text>
    <text x="400" y="415">$disconnect route</text>
    <text x="560" y="560" text-anchor="middle">Lambda Functions</text>
  </g>
</svg>
