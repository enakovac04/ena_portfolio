<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" role="img" aria-labelledby="title desc">
  <title id="title">API Gateway WebSocket architecture diagram</title>
  <desc id="desc">Clients connect to an API Gateway WebSocket API. Routes ($connect, $default, heartbeat, message, $disconnect) invoke Lambda functions, which read and write to DynamoDB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="1300" height="620" fill="#f8fafc"/>

  <!-- Clients -->
  <g transform="translate(80,220)" fill="#1f2937">
    <circle cx="32" cy="26" r="26" fill="#e5e7eb"/>
    <circle cx="90" cy="26" r="26" fill="#e5e7eb"/>
    <circle cx="61" cy="74" r="26" fill="#e5e7eb"/>
    <path d="M32 112c-24 0-44 11-44 24v16h88v-16c0-13-20-24-44-24zm58 0c-24 0-44 11-44 24v16h88v-16c0-13-20-24-44-24z" fill="#e5e7eb"/>
    <text x="60" y="155" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#111827">Clients</text>
  </g>

  <!-- API Gateway -->
  <g transform="translate(280,140)">
    <rect width="170" height="280" rx="14" fill="#8b5cf6"/>
    <rect x="22" y="26" width="24" height="228" fill="#f5f3ff"/>
    <rect x="124" y="26" width="24" height="228" fill="#f5f3ff"/>
    <rect x="65" y="90" width="40" height="60" rx="6" fill="#f5f3ff"/>
    <rect x="65" y="180" width="40" height="60" rx="6" fill="#f5f3ff"/>
    <text x="85" y="260" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#111827">API Gateway</text>
    <text x="85" y="284" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#111827">WebSocket API</text>
  </g>

  <!-- Lambda stack -->
  <g id="lambda-stack" transform="translate(620,70)">
    <g>
      <rect width="140" height="90" rx="12" fill="#f59e0b"/>
      <text x="70" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
    <g transform="translate(0,100)">
      <rect width="140" height="90" rx="12" fill="#f59e0b"/>
      <text x="70" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
    <g transform="translate(0,200)">
      <rect width="140" height="90" rx="12" fill="#f59e0b"/>
      <text x="70" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
    <g transform="translate(0,300)">
      <rect width="140" height="90" rx="12" fill="#f59e0b"/>
      <text x="70" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
    <g transform="translate(0,400)">
      <rect width="140" height="90" rx="12" fill="#f59e0b"/>
      <text x="70" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff">Lambda</text>
    </g>
  </g>

  <!-- DynamoDB -->
  <g transform="translate(1000,230)">
    <rect width="150" height="150" rx="16" fill="#a855f7"/>
    <path d="M45 55h60v60H45z" fill="none" stroke="#f3e8ff" stroke-width="7" />
    <path d="M60 70c13 7 30 7 42 0m-42 22c13 7 30 7 42 0m-42 22c13 7 30 7 42 0" stroke="#f3e8ff" stroke-width="7" fill="none"/>
    <text x="75" y="146" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#111827">DynamoDB</text>
  </g>

  <!-- Connectors -->
  <g stroke="#1f2937" stroke-width="2.6" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="300" x2="280" y2="300"/>
    <line x1="450" y1="170" x2="620" y2="110"/><!-- $connect -->
    <line x1="450" y1="220" x2="620" y2="200"/><!-- $default -->
    <line x1="450" y1="270" x2="620" y2="300"/><!-- heartbeat -->
    <line x1="450" y1="320" x2="620" y2="400"/><!-- message -->
    <line x1="450" y1="370" x2="620" y2="500"/><!-- $disconnect -->
    <line x1="760" y1="115" x2="1000" y2="260"/>
    <line x1="760" y1="305" x2="1000" y2="295"/>
    <line x1="760" y1="505" x2="1000" y2="340"/>
  </g>

  <!-- Route labels -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#111827">
    <text x="500" y="115">$connect route</text>
    <text x="500" y="215">$default route</text>
    <text x="500" y="295">heartbeat route</text>
    <text x="500" y="365">message route</text>
    <text x="500" y="445">$disconnect route</text>
    <text x="690" y="590" text-anchor="middle">Lambda Functions</text>
  </g>
</svg>
